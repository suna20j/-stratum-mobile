
name: test-and-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run Swift tests
        run: swift test

  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          pwd
          ls -la
          xcodegen generate --spec project.yml
          find . -maxdepth 4 -name "*.xcodeproj" -print

      - name: Build iOS Simulator app
        run: |
          PROJECT=$(find . -maxdepth 4 -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No .xcodeproj file was generated."
            find . -maxdepth 4 -type f -name "project.yml" -o -name "*.xcodeproj"
            exit 1
          fi

          echo "Using project: $PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -scheme StratumMobileApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: StratumMobile-iOS-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/StratumMobileApp.app
          if-no-files-found: error
